[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/OFL.txt,assets/licenses/GODOT_COPYRIGHT.txt,THIRD_PARTY_NOTICES.txt"
exclude_filter="art/*,docs/*,tests/*,tools/*,captures/*,builds/*"
export_path="builds/windows/Starlantern.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug=".tools/templates/windows_debug_x86_64.exe"
custom_template/release=".tools/templates/windows_release_x86_64.exe"
debug/export_console_wrapper=0
binary_format/embed_pck=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
texture_format/astc=false
